<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlackRoad Directory</title>
  <meta name="description" content="BlackRoad OS — One control plane. Many nodes. The canonical directory of all BlackRoad organizations.">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1a1a1a;
      --text: #e0e0e0;
      --text-dim: #666666;
      --accent: #44FF44;
      --accent-dim: #44FF4422;
      --font: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Consolas', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Header */
    header {
      text-align: center;
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    header h1 span { color: var(--accent); }

    header p.tagline {
      color: var(--text-dim);
      font-size: 0.85rem;
    }

    /* Live stats bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .stat-value.loading {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Org grid */
    .org-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
      margin-bottom: 3rem;
    }

    .org-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem;
      transition: border-color 0.2s, background 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .org-card:hover {
      border-color: var(--accent);
      background: #0d0d0d;
    }

    .org-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    .org-name {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .org-name span { color: var(--accent); }

    .org-repos {
      font-size: 0.75rem;
      color: var(--text-dim);
      background: var(--accent-dim);
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .org-role {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    .org-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .org-meta-item { opacity: 0.7; }

    /* Fleet section */
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .section-title span { color: var(--accent); }

    .fleet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-bottom: 3rem;
    }

    .fleet-node {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
    }

    .node-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }

    .node-hw {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 0.25rem;
    }

    .node-role {
      font-size: 0.75rem;
      color: var(--text-dim);
      opacity: 0.7;
    }

    /* Links bar */
    .links-bar {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      padding: 1.5rem 0;
      border-top: 1px solid var(--border);
    }

    .links-bar a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.8rem;
      transition: color 0.2s;
    }

    .links-bar a:hover { color: var(--accent); }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem 0;
      font-size: 0.7rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
    }

    footer .update-time { opacity: 0.5; }

    /* Error state */
    .error-note {
      text-align: center;
      padding: 1rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      opacity: 0.6;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container { padding: 1rem; }
      header { padding: 2rem 0 1.5rem; }
      header h1 { font-size: 1.4rem; }
      .stats-bar { gap: 1.25rem; }
      .org-grid { grid-template-columns: 1fr; }
      .fleet-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Black<span>Road</span> Directory</h1>
      <p class="tagline">One control plane. Many nodes.</p>
      <div class="stats-bar">
        <div class="stat">
          <div class="stat-value" id="org-count">15</div>
          <div class="stat-label">Organizations</div>
        </div>
        <div class="stat">
          <div class="stat-value loading" id="repo-count">&mdash;</div>
          <div class="stat-label">Repositories</div>
        </div>
        <div class="stat">
          <div class="stat-value">5</div>
          <div class="stat-label">Fleet Nodes</div>
        </div>
        <div class="stat">
          <div class="stat-value">$0</div>
          <div class="stat-label">AI Cost</div>
        </div>
      </div>
    </header>

    <div class="section-title"><span>//</span> Organizations</div>
    <div class="org-grid" id="org-grid"></div>

    <div class="section-title"><span>//</span> Fleet</div>
    <div class="fleet-grid" id="fleet-grid"></div>

    <div class="links-bar" id="links-bar"></div>

    <footer>
      BlackRoad OS, Inc. &mdash; Infrastructure is centralized. Intelligence is routed.
      <div class="update-time" id="update-time"></div>
    </footer>
  </div>

  <script>
    (async function () {
      const CONFIG_URL = 'config.json';
      let config;

      try {
        const res = await fetch(CONFIG_URL);
        config = await res.json();
      } catch {
        document.getElementById('org-grid').innerHTML =
          '<div class="error-note">Failed to load config.json</div>';
        return;
      }

      // Render static org cards (instant, no API wait)
      const orgGrid = document.getElementById('org-grid');
      config.organizations.forEach(org => {
        const card = document.createElement('a');
        card.className = 'org-card';
        card.href = `https://github.com/${org.github}`;
        card.target = '_blank';
        card.rel = 'noopener';
        card.innerHTML = `
          <div class="org-card-header">
            <div class="org-name">${formatOrgName(org.name)}</div>
            <div class="org-repos" id="repos-${org.github}">&mdash;</div>
          </div>
          <div class="org-role">${org.role}</div>
          <div class="org-meta">
            <span class="org-meta-item" id="meta-${org.github}"></span>
          </div>`;
        orgGrid.appendChild(card);
      });

      // Render fleet nodes
      const fleetGrid = document.getElementById('fleet-grid');
      config.fleet.nodes.forEach(node => {
        const el = document.createElement('div');
        el.className = 'fleet-node';
        el.innerHTML = `
          <div class="node-name">${node.name}</div>
          <div class="node-hw">${node.hardware}</div>
          <div class="node-role">${node.role}</div>`;
        fleetGrid.appendChild(el);
      });

      // Render links
      const linksBar = document.getElementById('links-bar');
      const linkLabels = {
        website: 'Website', docs: 'Docs', status: 'Status',
        agents: 'Agents', security: 'Security'
      };
      Object.entries(config.links).forEach(([key, url]) => {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = linkLabels[key] || key;
        linksBar.appendChild(a);
      });

      // Fetch live data from GitHub API (unauthenticated, 60 req/hr)
      let totalRepos = 0;
      let fetched = 0;
      const total = config.organizations.length;

      for (const org of config.organizations) {
        fetchOrgData(org.github).then(data => {
          fetched++;
          if (data) {
            totalRepos += data.public_repos;
            const repoEl = document.getElementById(`repos-${org.github}`);
            if (repoEl) repoEl.textContent = `${data.public_repos} repos`;
            const metaEl = document.getElementById(`meta-${org.github}`);
            if (metaEl && data.description) metaEl.textContent = data.description;
          }
          if (fetched === total) {
            const countEl = document.getElementById('repo-count');
            countEl.textContent = totalRepos.toLocaleString();
            countEl.classList.remove('loading');
            document.getElementById('update-time').textContent =
              `Last fetched: ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`;
          }
        });
      }

      async function fetchOrgData(orgName) {
        try {
          const res = await fetch(`https://api.github.com/orgs/${orgName}`);
          if (!res.ok) return null;
          return await res.json();
        } catch {
          return null;
        }
      }

      function formatOrgName(name) {
        // "BlackRoad-OS" -> "BlackRoad-<span>OS</span>"
        const parts = name.split('-');
        if (parts.length === 2) {
          return `${parts[0]}-<span>${parts[1]}</span>`;
        }
        return name;
      }
    })();
  </script>
</body>
</html>
