name: 🔑 Production Secrets Audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/production-secrets-audit.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit-secrets:
    name: Audit Production Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Audit Required Secrets
        id: audit
        run: |
          MISSING=""
          PRESENT=0
          TOTAL=0

          check_secret() {
            local name="$1"
            local value="$2"
            TOTAL=$((TOTAL + 1))
            if [ -z "$value" ]; then
              MISSING="$MISSING\n- $name"
            else
              PRESENT=$((PRESENT + 1))
            fi
          }

          # ── Stripe ──
          check_secret "STRIPE_SECRET_KEY" "${{ secrets.STRIPE_SECRET_KEY }}"
          check_secret "STRIPE_PUBLISHABLE_KEY" "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
          check_secret "STRIPE_WEBHOOK_SECRET" "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          check_secret "STRIPE_PRICE_PRO_MONTHLY" "${{ secrets.STRIPE_PRICE_PRO_MONTHLY }}"
          check_secret "STRIPE_PRICE_PRO_YEARLY" "${{ secrets.STRIPE_PRICE_PRO_YEARLY }}"
          check_secret "STRIPE_PRICE_ENT_MONTHLY" "${{ secrets.STRIPE_PRICE_ENT_MONTHLY }}"
          check_secret "STRIPE_PRICE_ENT_YEARLY" "${{ secrets.STRIPE_PRICE_ENT_YEARLY }}"

          # ── Google Drive ──
          check_secret "GOOGLE_SERVICE_ACCOUNT_KEY" "${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}"
          check_secret "GOOGLE_DRIVE_FOLDER_ID" "${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}"

          # ── Infrastructure ──
          check_secret "CLOUDFLARE_API_TOKEN" "${{ secrets.CLOUDFLARE_API_TOKEN }}"
          check_secret "CLOUDFLARE_ACCOUNT_ID" "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          check_secret "RAILWAY_TOKEN" "${{ secrets.RAILWAY_TOKEN }}"
          check_secret "DEPLOY_URL" "${{ secrets.DEPLOY_URL }}"

          # ── Auth ──
          check_secret "JWT_SECRET" "${{ secrets.JWT_SECRET }}"
          check_secret "NEXTAUTH_SECRET" "${{ secrets.NEXTAUTH_SECRET }}"
          check_secret "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" "${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}"
          check_secret "CLERK_SECRET_KEY" "${{ secrets.CLERK_SECRET_KEY }}"

          # ── AI ──
          check_secret "ANTHROPIC_API_KEY" "${{ secrets.ANTHROPIC_API_KEY }}"

          # ── Database ──
          check_secret "PG_PASSWORD" "${{ secrets.PG_PASSWORD }}"
          check_secret "REDIS_PASSWORD" "${{ secrets.REDIS_PASSWORD }}"
          check_secret "DATABASE_URL" "${{ secrets.DATABASE_URL }}"

          echo "present=$PRESENT" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          if [ -n "$MISSING" ]; then
            echo "status=incomplete" >> $GITHUB_OUTPUT
            echo "missing<<EOF" >> $GITHUB_OUTPUT
            echo -e "$MISSING" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "status=complete" >> $GITHUB_OUTPUT
            echo "missing=" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue for Missing Secrets
        if: steps.audit.outputs.status == 'incomplete'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const missing = `${{ steps.audit.outputs.missing }}`;
            const present = ${{ steps.audit.outputs.present }};
            const total = ${{ steps.audit.outputs.total }};

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'secrets-audit',
              state: 'open'
            });

            const title = `🔑 Missing Production Secrets (${present}/${total} configured)`;
            const body = `## Production Secrets Audit

            **Status:** ${present}/${total} secrets configured

            ### Missing Secrets:
            ${missing}

            ### How to Fix:
            1. Get the values from the appropriate service dashboards
            2. Set them as organization secrets:
               \`\`\`bash
               gh secret set SECRET_NAME --org BlackRoad-OS-Inc
               \`\`\`
            3. Or set per-repo: Settings > Secrets > Actions

            ### Reference:
            See \`production/SECRETS_REGISTRY.md\` in blackroad-operator for the full registry.

            ---
            *Generated by Production Secrets Audit workflow*`;

            if (existingIssues.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.data[0].number,
                title,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['secrets-audit', 'infrastructure', 'high-priority']
              });
            }

      - name: Report Status
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Production Secrets Audit"
          echo "Status: ${{ steps.audit.outputs.status }}"
          echo "Configured: ${{ steps.audit.outputs.present }}/${{ steps.audit.outputs.total }}"
          if [ "${{ steps.audit.outputs.status }}" = "incomplete" ]; then
            echo ""
            echo "Missing:"
            echo -e "${{ steps.audit.outputs.missing }}"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
